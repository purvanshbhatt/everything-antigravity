[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-antigravity"
version = "1.0.0"
description = "The Agent Harness Operating System & Performance Optimization Suite for Google Antigravity, Gemini, and Agentic Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team & Contributors" }
]
keywords = [
    "antigravity",
    "google-antigravity",
    "gemini",
    "agents",
    "skills",
    "subagents",
    "game-development",
    "multimedia",
    "video-editing",
    "security",
    "marketing",
    "harness-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0"
]
sdk = [
    "google-antigravity>=0.0.9"
]

[project.scripts]
eag = "src.cli:main"
everything-antigravity = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

