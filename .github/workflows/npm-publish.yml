name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Validate and test
        run: |
          node bin/eag.js validate --strict
          npm test
      - name: Versions match the release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in package.json plugin.json gemini-extension.json; do
            V="$(node -p "require('./$f').version")"
            [ "$V" = "$TAG" ] || { echo "$f is $V, tag is $TAG"; exit 1; }
          done
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
