name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate skills, agents, rules and manifests
        run: node bin/eag.js validate
      - name: Unit and integration tests (hooks, installer, CLI)
        run: npm test
      - name: Catalog is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: |
          node scripts/catalog.js
          git diff --exit-code -- docs/CATALOG.md
      - name: Install into a throwaway home and run doctor
        shell: bash
        run: |
          HOME_DIR="$(mktemp -d)"
          node bin/eag.js install --yes --home "$HOME_DIR"
          node bin/eag.js doctor --home "$HOME_DIR"
      - name: No secrets in the repository
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: |
          git ls-files -z -- ':!tests' | xargs -0 node -e '
            const fs = require("fs");
            const { scanSecrets } = require("./scripts/lib/shield");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const hits = scanSecrets(fs.readFileSync(f, "utf8"));
              if (hits.length) { bad++; console.log(`${f}: ${hits.map((h) => h.id).join(", ")}`); }
            }
            process.exit(bad ? 1 : 0);
          '
